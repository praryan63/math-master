<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover keeps safe areas working, user-scalable=no stops zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fb">
<title>Math Master</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- All screens are drawn by JS into this view -->
  <div id="view" class="view"></div>

  <!-- Bottom tab bar -->
  <nav id="bottom-nav" class="bottom-nav"></nav>

  <!-- Bottom sheet + backdrop -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet">
    <div class="sheet-grip"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <!-- Small confirm dialog -->
  <div id="dialog-backdrop" class="dialog-backdrop"></div>
  <div id="dialog" class="dialog"></div>

  <!-- Toast message -->
  <div id="toast" class="toast"></div>

  <!-- Load order matters: helpers first, app.js last -->
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
