name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm packages
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "android folder already exists"

      - name: Generate icons (optional, needs resources/icon.png)
        continue-on-error: true
        run: |
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#4338ca' --splashBackgroundColor '#f4f5fb' || true
          else
            echo "No resources/icon.png - skipping icon generation"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
